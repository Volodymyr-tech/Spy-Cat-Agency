<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SCA Dashboard</title>
    <link rel="stylesheet" href="/static/styles/auth.css">
    <style>
        .container { max-width: 900px; width: 95%; display: block; margin: 20px auto; height: auto; align-items: flex-start; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .section { background: var(--panel); padding: 20px; border-radius: var(--radius); border: 1px solid #2a2a2a; }
        .card { background: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 12px; border-left: 4px solid var(--accent); cursor: pointer; }
        h3 { color: var(--accent); margin-top: 0; display: flex; justify-content: space-between; align-items: center;}
        .btn-small { width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; border-radius: 8px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
        .card-actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn-action { width: auto; padding: 4px 10px; font-size: 11px; height: 26px; background: #2a2a2a; color: var(--text); border: 1px solid #444; border-radius: 6px; cursor: pointer; }
        .btn-delete { background: #4a1414; }
        .target-group { border-bottom: 1px solid #2a2a2a; padding-bottom: 10px; margin-bottom: 10px; }
        .target-item { background: #222; padding: 8px; margin-top: 5px; border-radius: 8px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
        #catDetails { background: #1a1a1a; border: 1px solid var(--accent); padding: 15px; border-radius: 10px; margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center;">Spy Cat Agency</h2>
        <div class="grid">
            <div class="section">
                <h3>Agents <button class="btn-small" onclick="toggleForm('catForm')">+</button></h3>
                <div id="catForm" class="form" style="display: none; margin-bottom: 20px;">
                    <input type="text" id="cName" placeholder="Name">
                    <input type="text" id="cBreed" placeholder="Breed">
                    <input type="number" id="cSalary" placeholder="Salary">
                    <button onclick="addCat()">Hire Agent</button>
                </div>
                <div id="catList"><div class="empty-state">Loading agents...</div></div>
                <div id="catDetails"></div>
            </div>
            <div class="section">
                <h3>Missions <button class="btn-small" onclick="toggleForm('missionForm')">+</button></h3>
                    <div id="missionForm" class="form" style="display: none; margin-bottom: 20px;">
                        <div id="targetInputs">
                                    <div class="target-group">
                                        <input type="text" class="t-name" placeholder="Target Name">
                                        <input type="text" class="t-country" placeholder="Country">
                                    </div>
                                </div>
                                <button class="btn-action" style="margin-bottom:10px" onclick="addTargetInput()">+ Add Target</button>
                                <button onclick="createMission()">Start Mission</button>
                        </div>
                        <div id="missionList"><div class="empty-state">Loading missions...</div></div>
                    <div id="missionDetails">
                    </div>
                </div>
            </div>
        </div>
    <script src="/static/js/cats.js"></script>
</body>
</html>
